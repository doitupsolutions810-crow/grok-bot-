name: manual-agent-task
run-name: "Grok Bot agent task by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for the live Grok Bot agents. Do not include secrets."
        required: true
        type: string
      mode:
        description: "Agent orchestration mode"
        required: true
        type: choice
        options:
          - chat
          - squad
          - deep
        default: squad

# The agent is deliberately not given a write-capable repository token.
permissions:
  contents: read

concurrency:
  group: grok-agent-task-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LLM_MODEL: qwen2.5:3b
      MODELS_REQUIRED: qwen2.5:3b,nomic-embed-text
      BOOT_STRICT: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Validate request size and mode
        env:
          AGENT_TASK: ${{ inputs.task }}
          AGENT_MODE: ${{ inputs.mode }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          task = os.environ.get("AGENT_TASK", "").strip()
          mode = os.environ.get("AGENT_MODE", "").strip()
          if not task:
              print("::error::Task must not be empty")
              sys.exit(1)
          if len(task) > 4000:
              print("::error::Task exceeds the 4000-character limit")
              sys.exit(1)
          if mode not in {"chat", "squad", "deep"}:
              print("::error::Invalid agent mode")
              sys.exit(1)
          print(f"Validated task request: mode={mode}, chars={len(task)}")
          PY

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose --profile full config --quiet

      - name: Start real Grok Bot runtime
        run: docker compose up -d --build

      - name: Wait for real boot self-test
        run: |
          ok=0
          for i in $(seq 1 100); do
            if curl -fsS --max-time 5 http://localhost:3000/api/status -o /tmp/grok-status.json; then
              if grep -q '"ready":true' /tmp/grok-status.json; then
                cat /tmp/grok-status.json
                ok=1
                break
              fi
            fi
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Grok Bot did not reach its strict ready state within 25 minutes"
            docker compose ps
            docker compose logs --tail 120 grok-bot ollama socket-proxy || true
            exit 1
          fi

      - name: Run the requested live agent task
        env:
          AGENT_TASK: ${{ inputs.task }}
          AGENT_MODE: ${{ inputs.mode }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          task = os.environ["AGENT_TASK"].strip()
          mode = os.environ["AGENT_MODE"].strip()
          payload = json.dumps({"message": task, "mode": mode}).encode("utf-8")
          request = urllib.request.Request(
              "http://127.0.0.1:3000/api/chat",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=3600) as response:
                  result = json.loads(response.read(2_000_000).decode("utf-8"))
          except urllib.error.HTTPError as exc:
              detail = exc.read(1200).decode("utf-8", "replace")
              print(f"::error::Grok Bot returned HTTP {exc.code}: {detail[:900]}")
              sys.exit(1)
          except Exception as exc:
              print(f"::error::Live agent request failed: {type(exc).__name__}: {exc}")
              sys.exit(1)

          answer = result.get("answer", result) if isinstance(result, dict) else result
          output = {
              "agentId": result.get("agentId") if isinstance(result, dict) else None,
              "mode": result.get("mode", mode) if isinstance(result, dict) else mode,
              "runId": result.get("runId", result.get("run_id")) if isinstance(result, dict) else None,
              "answer": answer,
          }
          rendered = json.dumps(output, ensure_ascii=False, indent=2)
          # GitHub run logs are visible to repository readers; avoid huge accidental dumps.
          print(rendered[:12000])
          if len(rendered) > 12000:
              print(f"[output truncated: {len(rendered)} characters total]")
          PY

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail 160 grok-bot ollama socket-proxy || true

      - name: Stop runtime
        if: always()
        run: docker compose down || true

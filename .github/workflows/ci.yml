name: live-tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  swarm-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax check signed swarm bridge
        run: node --check src/server.js && node --check src/swarm/executor.js
      - name: Swarm evidence and failure-gate tests
        run: npm run test:swarm

  live:
    runs-on: ubuntu-24.04    # pinned: ubuntu-latest migrated to Ubuntu 26 on 2026-10-19 (actions/runner-images#14748)
    timeout-minutes: 90
    env:
      LLM_MODEL: qwen2.5:3b
      MODELS_REQUIRED: qwen2.5:3b,nomic-embed-text
      BOOT_STRICT: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Config compatibility check (core + full profile)
        run: |
          docker compose config --quiet
          docker compose --profile full config --quiet

      - name: Bring up the full live stack
        run: docker compose up -d --build

      - name: Wait for boot self-test (real image+model pulls, MCP handshake)
        run: |
          ok=0
          for i in $(seq 1 100); do
            if curl -fsS http://localhost:3000/api/status -o status.json; then ok=1; break; fi
            sleep 15
          done
          if [ "$ok" = 1 ]; then
            cat status.json
            grep -q '"ready":true' status.json
          else
            echo "server never answered within the 25-minute window; last boot logs:"
            docker compose logs --tail 30 grok-bot 2>&1 | tail -n 10 | while IFS= read -r l; do
              l="${l//%/%25}"
              echo "::error::${l:0:220}"
            done
            exit 1
          fi

      - name: Live agent tests (real inference, docker exec, browser)
        run: docker compose exec -T grok-bot node tests/live.test.js

      - name: Agents' evolution loop (writes EVOLVE.md from the live runs)
        run: docker compose exec -T grok-bot node scripts/evolve.js

      - name: Boot + agent logs on failure
        if: failure()
        run: |
          docker compose logs --tail 300
          docker compose logs --tail 40 grok-bot 2>&1 | tail -n 10 | while IFS= read -r l; do
            l="${l//%/%25}"
            echo "::error::${l:0:220}"
          done

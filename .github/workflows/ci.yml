name: live-tests
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LLM_MODEL: qwen2.5:3b
      MODELS_REQUIRED: qwen2.5:3b,nomic-embed-text
      BOOT_STRICT: "true"
      AVRONE_BUILD_CONTEXT: Avrone
      COMPOSE_FILE: docker-compose.yml:docker-compose.integration.yml
    steps:
      - uses: actions/checkout@v4
      - name: Checkout AVRONE for integrated-stack validation
        uses: actions/checkout@v4
        with:
          repository: doitupsolutions810-crow/Avrone
          ref: main
          path: Avrone

      - name: Config compatibility check (core + full + integration)
        run: |
          docker compose config --quiet
          docker compose --profile full config --quiet
          test -f Avrone/Dockerfile
          test -f Avrone/pyproject.toml

      - name: Bring up the full integrated live stack
        run: docker compose --profile full up -d --build

      - name: Wait for boot self-test (real image+model pulls, MCP handshake)
        run: |
          ok=0
          for i in $(seq 1 100); do
            if curl -fsS http://localhost:3000/api/status -o status.json; then ok=1; break; fi
            sleep 15
          done
          if [ "$ok" = 1 ]; then
            cat status.json
            grep -q '"ready":true' status.json
          else
            echo "server never answered within the 25-minute window; last boot logs:"
            docker compose logs --tail 30 grok-bot 2>&1 | tail -n 10 | while IFS= read -r l; do
              l="${l//%/%25}"
              echo "::error::${l:0:220}"
            done
            exit 1
          fi

      - name: Live agent tests (real inference, Docker exec, browser, AVRONE bridge)
        run: docker compose exec -T grok-bot node tests/live.test.js

      - name: Agents' evolution loop (writes EVOLVE.md from the live runs)
        run: docker compose exec -T grok-bot node scripts/evolve.js

      - name: Boot + agent logs on failure
        if: failure()
        run: |
          docker compose logs --tail 300
          docker compose logs --tail 40 grok-bot 2>&1 | tail -n 10 | while IFS= read -r l; do
            l="${l//%/%25}"
            echo "::error::${l:0:220}"
          done

      - name: Capture integrated-stack diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          docker compose ps -a > diagnostics/compose-ps.txt 2>&1 || true
          docker compose logs --no-color --tail 500 > diagnostics/compose.log 2>&1 || true
          docker compose config > diagnostics/compose-config.yml 2>&1 || true
          if [ -f status.json ]; then cp status.json diagnostics/status.json; fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: grok-bot-live-diagnostics-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7

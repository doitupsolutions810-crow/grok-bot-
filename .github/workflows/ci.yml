name: live-tests
on:
  push: { branches: [main] }
  workflow_dispatch:

# a newer push supersedes older live runs (each takes up to ~30 min of runner time)
concurrency:
  group: live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-24.04    # pinned: ubuntu-latest migrated to Ubuntu 26 on 2026-10-19 (actions/runner-images#14748)
    timeout-minutes: 90
    env:
      LLM_MODEL: qwen2.5:3b
      MODELS_REQUIRED: qwen2.5:3b,nomic-embed-text
      BOOT_STRICT: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Offline edge-case suite (agents CRUD, custom instructions, ledger, approvals, scheduler)
        run: npm install --no-audit --no-fund && npm test

      - name: Config compatibility check (core + full profile)
        run: |
          docker compose config --quiet
          docker compose --profile full config --quiet

      - name: Bring up the full live stack
        run: docker compose up -d --build

      - name: Wait for boot self-test (real image+model pulls, MCP handshake)
        run: |
          # server.js binds :3000 only after the full boot chain (daemon, ollama,
          # real model pulls, MCP handshake, self-test) completes. A first boot on
          # a fresh runner pulls ~2GB of models, which can outlast a short wait —
          # size the window to real pulls, and surface the boot logs as run
          # annotations if the port still never answers.
          ok=0
          for i in $(seq 1 100); do
            if curl -fsS http://localhost:3000/api/status -o status.json; then ok=1; break; fi
            sleep 15
          done
          if [ "$ok" = 1 ]; then
            cat status.json
            grep -q '"ready":true' status.json
          else
            echo "server never answered within the 25-minute window; last boot logs:"
            docker compose logs --tail 30 grok-bot 2>&1 | tail -n 25 | while IFS= read -r l; do
              l="${l//%/%25}"
              echo "::error::${l:0:220}"
            done
            exit 1
          fi

      - name: Live agent tests (real inference, docker exec, browser)
        run: docker compose exec -T grok-bot node tests/live.test.js

      - name: Team council (real agents talk, use their tools, record eurekas)
        timeout-minutes: 20
        run: |
          curl -fsS -X POST http://localhost:3000/api/agents -H 'content-type: application/json' \
            -d '{"name":"Edge Critic","job":"edge case review","instructions":"You review test plans and point out the edge cases nobody tested. Speak plainly and politely."}' >/dev/null || true
          curl -fsS --max-time 1100 -X POST http://localhost:3000/api/council -H 'content-type: application/json' \
            -d '{"topic":"Continue even longer, more robust testing against even more edge cases, and fix along the way. Which edge case in this system should we test next, and why?","agents":["grok-main","edge-critic"],"rounds":2}' \
            -o council.json
          node -e '
            const c = require("./council.json"); const fs = require("fs");
            const md = ["## Team council", "", ...c.dialogue.map(m => `**${m.from}**${m.to !== "*" ? " → " + m.to : ""}: ${m.text.replace(/\n+/g, " ")}`), "", "## Eurekas", ...c.eurekas.map(e => `- ${e.text} (${e.agent})`)];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md.join("\n\n") + "\n");
            // annotations are readable through the API without downloading logs
            for (const m of c.dialogue.slice(0, 8)) console.log(`::notice title=council ${m.from}::${m.text.replace(/\s+/g, " ").replace(/%/g, "%25").slice(0, 600)}`);
            for (const e of c.eurekas.slice(0, 2)) console.log(`::notice title=eureka ${e.agent}::${e.text.replace(/\s+/g, " ").replace(/%/g, "%25").slice(0, 400)}`);
          '

      - name: Agents' evolution loop (writes EVOLVE.md from the live runs)
        run: docker compose exec -T grok-bot node scripts/evolve.js

      - name: Boot + agent logs on failure
        if: failure()
        run: |
          docker compose logs --tail 300
          # surface the failure tail as run annotations too (readable without sign-in)
          docker compose logs --tail 40 grok-bot 2>&1 | tail -n 25 | while IFS= read -r l; do
            l="${l//%/%25}"
            echo "::error::${l:0:220}"
          done

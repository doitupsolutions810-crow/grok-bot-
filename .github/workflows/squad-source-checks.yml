name: squad-source-checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run offline Python suite
        env:
          AVRONE_LLM_MODE: mock
          AVRONE_RUNNER: local
        run: python -m pytest -q -m "not integration"

  node-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check JavaScript syntax
        run: |
          node --check src/server.js
          node --check scripts/evolve.js
          node --check tests/live.test.js
      - name: Run deterministic Node tests
        run: npm test

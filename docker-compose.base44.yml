# Base44 development stack for Grok Bot + AVRONE.
#
# Runs everything FROM THE CLONED SOURCE with live reload — never the repo's
# production image (build: . / COPY . .), so edits are visible without a rebuild.
# See AGENTS.md for the wiring, the why, and how to verify the stack.
#
#   docker compose -f docker-compose.base44.yml up -d --build
#
# grok-bot  -> http://localhost:3000  (web console, main preview)
# avrone    -> http://localhost:8710  (AVRONE console + REST)

services:
  # The app talks to the host Docker daemon through this proxy (no raw socket bind).
  # Its `terminal` tool shells out to `docker exec` in grok-sandbox and the boot
  # chain creates that sandbox container, so CONTAINERS/EXEC/POST must stay on.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: on-failure
    environment:
      PING: 1
      INFO: 1
      CONTAINERS: 1
      EXEC: 1
      POST: 1
      PULL: 1
      IMAGES: 1
      ALLOW_RESTARTS: 1
      NETWORKS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2375/_ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    labels:
      base44.project: "Docker socket proxy"
      base44.kind: infra

  # Local LLM backend. Models live in a volume and are pulled by the boot chain.
  ollama:
    image: ollama/ollama:latest
    restart: on-failure
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    labels:
      base44.project: "Ollama"
      base44.kind: infra

  # Shared "computer": one persistent Chromium profile exposed over CDP on :3000.
  # The playwright image ships the browsers but not the npm package, so the dev
  # image installs it globally (browsers are skipped — the image already has them).
  browser:
    build:
      context: .
      dockerfile_inline: |
        FROM mcr.microsoft.com/playwright:v1.64.1-jammy
        ENV PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 NODE_PATH=/usr/lib/node_modules
        RUN npm install -g playwright@1.64.1
    command: ["node", "/app/computer.js"]
    restart: on-failure
    volumes:
      - ./browser-service/computer.js:/app/computer.js:ro
      - browser_profile:/profile
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/json/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    labels:
      base44.project: "Shared browser"
      base44.kind: infra

  grok-bot:
    build:
      context: .
      dockerfile_inline: |
        FROM node:22-slim
        # curl/ca-certificates: healthchecks + outbound fetches
        # docker.io: the `terminal` tool runs `docker exec grok-sandbox ...`
        # python3/make/g++: native build fallback for better-sqlite3
        RUN apt-get update && apt-get install -y --no-install-recommends \
              curl ca-certificates docker.io python3 make g++ \
            && rm -rf /var/lib/apt/lists/*
        WORKDIR /app
        ENV NODE_ENV=development PORT=3000 PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
        # Installed at build time so the boot MCP handshake never waits on npm.
        RUN npm install -g @modelcontextprotocol/server-filesystem
    # Dependencies live in the node_modules volume: install on startup, then dev.
    # --no-package-lock: the repo ships no lockfile, and installing through the
    # bind mount must not leave a generated one behind in the working tree.
    command: ["sh", "-ec", "npm install --no-audit --no-fund --no-package-lock && exec node --watch src/server.js"]
    restart: on-failure
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - /run/base44/app.env
    environment:
      PORT: 3000
      DOCKER_HOST: tcp://socket-proxy:2375
      OLLAMA_URL: http://ollama:11434
      BROWSER_WS: http://browser:3000
      LLM_PROVIDER: ollama
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      # Tags must match what `ollama list` reports exactly: the boot gate waits for
      # the literal name, and the embed model is tagged :latest on pull.
      MODELS_REQUIRED: ${MODELS_REQUIRED:-qwen2.5:3b,nomic-embed-text:latest}
      ALLOWED_TERMINAL_CONTAINERS: grok-sandbox
      # Strict boot = the real self-tests gate readiness (the app's own default).
      BOOT_STRICT: ${BOOT_STRICT:-true}
      GROK_MAX_PARALLEL: ${GROK_MAX_PARALLEL:-4}
      GROK_MIN_PARALLEL: ${GROK_MIN_PARALLEL:-1}
      GROK_WANT_PARALLEL: ${GROK_WANT_PARALLEL:-}
      GROK_THERMAL_MAX_C: ${GROK_THERMAL_MAX_C:-80}
      GROK_GOVERNOR: ${GROK_GOVERNOR:-true}
      GROK_SQUAD_N: ${GROK_SQUAD_N:-4}
      GROK_SQUAD_STEPS: ${GROK_SQUAD_STEPS:-12}
      GROK_DEEP_ROUNDS: ${GROK_DEEP_ROUNDS:-3}
      GROK_MAX_SPAWN_DEPTH: ${GROK_MAX_SPAWN_DEPTH:-2}
      SKILLS_DIR: /app/skills
      # The AVRONE console runs as a sibling service in this stack.
      AVRONE_URL: http://avrone:8710
      WHISPER_URL: ${WHISPER_URL:-}
      PIPER_CMD: ${PIPER_CMD:-}
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      # The app opens /app/data/*.db at import time and expects the directory to
      # exist (the repo's own compose bind-mounts ./data the same way).
      - ./data:/app/data
    depends_on:
      socket-proxy:
        condition: service_healthy
      ollama:
        condition: service_healthy
      browser:
        condition: service_healthy
    # The app only listens after the boot chain finishes (image + model pulls,
    # then the live self-tests), so the grace period is generous on purpose.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30m
    labels:
      base44.project: "Grok Bot"
      base44.kind: web
      base44.port: "3000"

  # AVRONE: the Python half of the system (consoles on 8710, bridge at /api/chat).
  # Deps come from pyproject.toml at build time; the source is bind-mounted and
  # served by uvicorn --reload.
  avrone:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        RUN pip install --no-cache-dir "fastapi>=0.110" "uvicorn[standard]>=0.29" "httpx>=0.27"
    command: ["sh", "-ec", "exec python -m uvicorn avrone.server:app --host 0.0.0.0 --port 8710 --reload --reload-dir /app/avrone"]
    restart: on-failure
    ports:
      - "8710:8710"
    environment:
      PYTHONUNBUFFERED: "1"
      AVRONE_HOST: 0.0.0.0
      AVRONE_PORT: 8710
      # Same local model backend as Grok Bot — no external credentials needed.
      AVRONE_PROVIDER: ollama
      AVRONE_LLM_BASE_URL: http://ollama:11434/v1
      AVRONE_LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      AVRONE_RUNNER: local
      AVRONE_WORKSPACE: /var/avrone/workspace
      AVRONE_DATA_DIR: /var/avrone/data
    volumes:
      - ./:/app
      - avrone_state:/var/avrone
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8710/api/status', timeout=4).status==200 else 1)\""]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      base44.project: "AVRONE"
      base44.kind: api
      base44.port: "8710"

volumes:
  ollama_models:
  browser_profile:
  node_modules:
  avrone_state:

# Base44 sandbox runbook — development wiring, not a production deployment.
# Runs the app from the bind-mounted checkout with node --watch; port 3000 is
# the user-facing web entry point.
services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: on-failure
    environment:
      PING: 1
      INFO: 1
      CONTAINERS: 1
      EXEC: 1
      POST: 1
      PULL: 1
      IMAGES: 1
      ALLOW_RESTARTS: 1
      NETWORKS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2375/_ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  ollama:
    image: ollama/ollama:latest
    restart: on-failure
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  browser:
    build:
      context: ./browser-service
    restart: on-failure
    command: node /app/computer.js
    volumes:
      - ./browser-service/computer.js:/app/computer.js:ro
      - ./browser-service/cdp-proxy.js:/app/cdp-proxy.js:ro
      - browser_profile:/profile
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/json/version >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  grok-bot:
    build:
      context: .
      dockerfile: Dockerfile.base44
    restart: on-failure
    labels:
      base44.project: "Grok Bot"
      base44.kind: "web"
      base44.port: "3000"
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 3000
      DOCKER_HOST: tcp://socket-proxy:2375
      LLM_PROVIDER: ollama
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: qwen2.5:3b
      MODELS_REQUIRED: qwen2.5:3b,nomic-embed-text
      BROWSER_WS: http://browser:3000
      ALLOWED_TERMINAL_CONTAINERS: grok-sandbox
      BOOT_STRICT: "true"
      SKILLS_DIR: /app/skills
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: ["sh", "-ec", "mkdir -p /app/data/images && npm install --omit=dev --no-audit --no-fund --no-package-lock && exec node --watch src/server.js"]
    depends_on:
      socket-proxy:
        condition: service_healthy
      ollama:
        condition: service_healthy
      browser:
        condition: service_healthy
    healthcheck:
      # The server only listens after the full boot chain; give model pulls room.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20m

volumes:
  ollama_models:
  node_modules:
  browser_profile:

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      PING: 1
      INFO: 1
      CONTAINERS: 1
      EXEC: 1
      POST: 1
      PULL: 1
      IMAGES: 1
      ALLOW_RESTARTS: 1
      NETWORKS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  grok-bot:
    build: .
    container_name: grok-bot
    restart: unless-stopped
    # Local-only by default: the console exposes terminal and agent tools.
    # Put it behind an authenticated reverse proxy before exposing it remotely.
    ports: ["127.0.0.1:3000:3000"]
    # Lets the in-container AVRONE bridge reach a host-launched AVRONE on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 3000
      DOCKER_HOST: tcp://socket-proxy:2375      # no raw socket mount anymore
      LLM_PROVIDER: ollama
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      MODELS_REQUIRED: ${MODELS_REQUIRED:-qwen2.5:3b,nomic-embed-text}
      MODEL_CHAIN: ${MODEL_CHAIN:-}
      ENABLE_VISION: ${ENABLE_VISION:-false}
      X_API_BEARER: ${X_API_BEARER:-}
      X_ACCOUNT: ${X_ACCOUNT:-grok_bot}
      X_POLL_SECONDS: ${X_POLL_SECONDS:-60}
      BROWSER_WS: ws://browser:3000
      ALLOWED_TERMINAL_CONTAINERS: grok-sandbox
      BOOT_STRICT: ${BOOT_STRICT:-true}
      # Governor (Avrone) — health-gated parallelism
      GROK_MAX_PARALLEL: ${GROK_MAX_PARALLEL:-4}
      GROK_MIN_PARALLEL: ${GROK_MIN_PARALLEL:-1}
      GROK_WANT_PARALLEL: ${GROK_WANT_PARALLEL:-}
      GROK_THERMAL_MAX_C: ${GROK_THERMAL_MAX_C:-80}
      GROK_GOVERNOR: ${GROK_GOVERNOR:-true}
      # Orchestration (Trinity)
      GROK_SQUAD_N: ${GROK_SQUAD_N:-4}
      GROK_SQUAD_STEPS: ${GROK_SQUAD_STEPS:-12}
      GROK_DEEP_ROUNDS: ${GROK_DEEP_ROUNDS:-3}
      GROK_MAX_SPAWN_DEPTH: ${GROK_MAX_SPAWN_DEPTH:-2}
      SKILLS_DIR: /app/skills
      WHISPER_URL: ${WHISPER_URL:-}             # full profile: http://whisper:9000 (HTTP STT sidecar)
      PIPER_CMD: ${PIPER_CMD:-}                 # TTS binary override (default: piper)
      AVRONE_URL: ${AVRONE_URL:-}               # the concluding system bridge -> AVRONE
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./data/images:/output                 # generated images (served by /api/images)
      - ./skills:/app/skills:ro               # SKILL.md playbooks
    depends_on: [ollama, browser, socket-proxy]

  ollama:
    image: ollama/ollama:latest
    container_name: grok-ollama
    restart: unless-stopped
    volumes: [ollama_models:/root/.ollama]
    # GPU: uncomment deploy.resources.devices [driver: nvidia, count: all, capabilities: [gpu]]

  browser:
    image: mcr.microsoft.com/playwright:v1.64.1-jammy
    container_name: grok-browser
    restart: unless-stopped
    command: node /app/computer.js
    volumes:
      - ./browser-service/computer.js:/app/computer.js:ro
      - browser_profile:/profile        # logins + cookies persist across restarts & bots

  whisper:
    image: onerahmet/whisper-asr-webservice:latest
    restart: unless-stopped
    profiles: ["full"]
    environment: { ASR_MODEL: base, ASR_ENGINE: openai }
    volumes: [./models/whisper:/root/.cache ]

  piper:
    image: rhasspy/wyoming-piper:latest
    restart: unless-stopped
    profiles: ["full"]
    volumes: [./voices:/voices]

  comfyui:
    image: ghcr.io/comfyanonymous/comfyui:latest
    restart: unless-stopped
    profiles: ["full"]
    volumes:
      - comfyui_models:/home/user/comfyui/models
      - ./data/images:/output

volumes:
  ollama_models:
  comfyui_models:
  browser_profile:                  # shared persistent browser computer
  grok_workspace:                   # shared sandbox filesystem for all agents
